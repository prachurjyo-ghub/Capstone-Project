name: partsark-capstone

services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: partsark_capstone
      POSTGRES_USER: capstone
      POSTGRES_PASSWORD: capstone_local_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capstone -d partsark_capstone"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "capstone_local_redis"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "capstone_local_redis", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
